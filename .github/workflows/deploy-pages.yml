name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a deploy to be re-run by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead, and do not cancel one midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Whole history, so release notes can fall back to commit subjects
          # since the last tag.
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          # Keep in step with the version pinned in .fvmrc.
          flutter-version: 3.32.0
          channel: stable
          cache: true

      - run: flutter pub get

      # Pages serves the site from /<repo>/, so the app has to be built with
      # that base path or every asset request 404s. --no-web-resources-cdn
      # bundles CanvasKit so the build is self-contained.
      # The app learns what it is from these, and compares them with
      # latest.json to tell whether a newer build is out.
      - name: Build web
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          flutter build web \
            --release \
            --no-web-resources-cdn \
            --base-href "/${GITHUB_REPOSITORY#*/}/" \
            --dart-define=APP_VERSION=$VERSION \
            --dart-define=APP_BUILD_NUMBER=${{ github.run_number }} \
            --dart-define=APP_COMMIT=${{ github.sha }}

      # Deployed next to the site, so an open tab can see it is out of date.
      - name: Write latest.json
        run: python3 tool/write_latest_json.py build/web/latest.json

      # Pages has no server-side routing, so a deep link would 404 on reload.
      # Serving index.html as the 404 page makes the app handle the route.
      - name: Add SPA fallback
        run: cp build/web/index.html build/web/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
