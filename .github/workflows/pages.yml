name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  # Allows a deploy to be re-run by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead, and do not cancel one midway.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The one Flutter version, kept equal to .fvmrc. A test holds every
  # workflow to it.
  FLUTTER_VERSION: 3.32.0

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Whole history, so latest.json notes can fall back to the commits
          # since the last tag.
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Pages serves the site from /<repo>/, so the app is built with that
      # base path. The defines let it compare itself with latest.json.
      - name: Build web
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          flutter build web \
            --release \
            --no-web-resources-cdn \
            --base-href "/${GITHUB_REPOSITORY#*/}/" \
            --build-name=$VERSION \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_VERSION=$VERSION \
            --dart-define=BUILD_NUMBER=${{ github.run_number }} \
            --dart-define=APP_COMMIT=${{ github.sha }}

      # Deployed next to the site, with this commit, so an open tab can tell
      # it is out of date.
      - name: Write latest.json
        run: python3 tool/write_latest_json.py build/web/latest.json

      # Pages has no server-side routing, so a deep link would 404 on reload.
      - name: Add SPA fallback
        run: cp build/web/index.html build/web/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
