name: Deploy web to GitHub Pages and Cloudflare Pages

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  # Allows a deploy to be re-run by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead, and do not cancel one midway.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The one Flutter version, kept equal to .fvmrc. A test holds every
  # workflow to it.
  FLUTTER_VERSION: 3.32.0

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Whole history, so latest.json notes can fall back to the commits
          # since the last tag.
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Pages serves the site from /<repo>/, so the app is built with that
      # base path. The defines let it compare itself with latest.json.
      - name: Build web
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          flutter build web \
            --release \
            --no-web-resources-cdn \
            --base-href "/${GITHUB_REPOSITORY#*/}/" \
            --build-name=$VERSION \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_VERSION=$VERSION \
            --dart-define=BUILD_NUMBER=${{ github.run_number }} \
            --dart-define=APP_COMMIT=${{ github.sha }}

      # Deployed next to the site, with this commit, so an open tab can tell
      # it is out of date.
      - name: Write latest.json
        run: python3 tool/write_latest_json.py build/web/latest.json

      # Pages has no server-side routing, so a deep link would 404 on reload.
      - name: Add SPA fallback
        run: cp build/web/index.html build/web/404.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  # The same site again on Cloudflare Pages, at its root rather than under
  # /quoridor/, so it is its own build. Skipped with a warning when the
  # CLOUDFLARE_API_TOKEN secret (Cloudflare Pages: Edit) is not set.
  cloudflare:
    name: Deploy to Cloudflare Pages
    needs: test
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      # Not a secret: it names the account, it does not grant access to it.
      CLOUDFLARE_ACCOUNT_ID: 59e2f1308a0af66321e49dc4cb473736
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The site is served at <project>.pages.dev, from each project here.
      # playquoridor is the address invites lead to (InviteLink.webHome);
      # quoridor-mohager is the old one, kept for invites from 1.1.5 and
      # earlier and the promo video's QR code. The installed app opens
      # invite links on both (AndroidManifest.xml, Runner.entitlements).
      PROJECTS: playquoridor quoridor-mohager
    steps:
      - name: Say why nothing was deployed
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set, so the web build was not deployed to Cloudflare Pages."

      - uses: actions/checkout@v5
        if: env.HAS_TOKEN == 'true'
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        if: env.HAS_TOKEN == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-node@v5
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: 24

      - name: Build web
        if: env.HAS_TOKEN == 'true'
        run: |
          flutter pub get
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          flutter build web \
            --release \
            --no-web-resources-cdn \
            --base-href / \
            --build-name=$VERSION \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_VERSION=$VERSION \
            --dart-define=BUILD_NUMBER=${{ github.run_number }} \
            --dart-define=APP_COMMIT=${{ github.sha }}
          python3 tool/write_latest_json.py build/web/latest.json

      # The first deploy creates a project; after that it already exists.
      - name: Create the Pages projects that are missing
        if: env.HAS_TOKEN == 'true'
        run: |
          for project in $PROJECTS; do
            if ! out=$(npx --yes wrangler@4 pages project create "$project" --production-branch=main 2>&1); then
              echo "$out" | grep -qi "already exists" || { echo "$out"; exit 1; }
            fi
          done

      # Cloudflare adds a random suffix (quoridor-5q7) when another account
      # holds the name, and then the app's links would point nowhere. Say so
      # loudly rather than deploy to an address nobody links to.
      - name: Check each project got its own address
        if: env.HAS_TOKEN == 'true'
        run: |
          for project in $PROJECTS; do
            subdomain=$(curl -fsS \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$project" \
              | jq -r '.result.subdomain')
            if [ "$subdomain" != "$project.pages.dev" ]; then
              echo "::error::The Pages project $project is served at $subdomain, not $project.pages.dev. Pick a free name and change it in this file, InviteLink, AndroidManifest.xml and Runner.entitlements."
              exit 1
            fi
          done

      - name: Deploy
        if: env.HAS_TOKEN == 'true'
        run: |
          for project in $PROJECTS; do
            npx --yes wrangler@4 pages deploy build/web \
              --project-name="$project" \
              --branch=main \
              --commit-hash="$GITHUB_SHA"
          done

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
