name: CI

on:
  push:
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  # Lets a run be started by hand from the Actions tab: a run can fail to be
  # queued at all, and without this the only way to ask is an empty commit.
  workflow_dispatch:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The one Flutter version, kept equal to .fvmrc. A test holds every
  # workflow to it.
  FLUTTER_VERSION: 3.32.0

jobs:
  check:
    name: Format, analyze, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      # The tree is clean, so anything analyze reports fails the build.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # A broken build shows up here, in the PR, not on release day.
      - name: Build web
        run: flutter build web --release --no-web-resources-cdn

      - name: Upload test failures
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-failures
          path: |
            test/**/failures/
          if-no-files-found: ignore

  rules:
    name: Firestore Security Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: test/rules/package.json

      # The Firestore emulator runs on the JVM.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install rules test dependencies
        working-directory: test/rules
        run: npm install

      # The rules are the boundary that has to hold even against a modified
      # client, so they are tested against the real emulator.
      - name: Test rules against the Firestore emulator
        run: >
          npx --yes firebase-tools@13 emulators:exec
          --only firestore
          --project quoridor-rules-test
          "cd test/rules && npm test"
