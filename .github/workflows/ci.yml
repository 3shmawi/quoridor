name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, analyze, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Keep in step with the version pinned in .fvmrc.
          flutter-version: 3.32.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      # Infos are not fatal: the tree still carries pre-existing `withOpacity`
      # deprecations. Errors and warnings do fail the build.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # Catches breakage that only shows up in a real compile, and proves the
      # game builds with no API key configured.
      - name: Build web
        run: flutter build web --release --no-web-resources-cdn
