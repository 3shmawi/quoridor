name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, analyze, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Keep in step with the version pinned in .fvmrc.
          flutter-version: 3.32.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      # The tree is clean, so anything analyze reports -- including infos and
      # lints -- fails the build and stays fixed.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Catches breakage that only shows up in a real compile, and proves the
      # game builds with no API key configured.
      - name: Build web
        run: flutter build web --release --no-web-resources-cdn

  rules:
    name: Firestore Security Rules
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: test/rules/package.json

      # The Firestore emulator runs on the JVM.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install rules test dependencies
        working-directory: test/rules
        run: npm install

      # The rules are the boundary that has to hold even against a modified
      # client, so they get tested against the real emulator rather than
      # trusted by inspection.
      - name: Test rules against the Firestore emulator
        run: >
          npx --yes firebase-tools@13 emulators:exec
          --only firestore
          --project quoridor-rules-test
          "cd test/rules && npm test"
