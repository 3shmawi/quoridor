name: CI

on:
  push:
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  # Lets a run be started by hand from the Actions tab: a run can fail to be
  # queued at all, and without this the only way to ask is an empty commit.
  workflow_dispatch:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The one Flutter version, kept equal to .fvmrc. A test holds every
  # workflow to it.
  FLUTTER_VERSION: 3.32.0

jobs:
  check:
    name: Format, analyze, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      # The tree is clean, so anything analyze reports fails the build.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # A broken build shows up here, in the PR, not on release day.
      - name: Build web
        run: flutter build web --release --no-web-resources-cdn

      - name: Upload test failures
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-failures
          path: |
            test/**/failures/
          if-no-files-found: ignore

  # Android is otherwise only built on release day, which is where a target
  # SDK below Google Play's floor was found: the bundle uploaded, then Play
  # refused it.
  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Without the signing secrets a release build falls back to the debug
      # key, which is enough to prove it builds.
      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      # Google Play refuses an upload whose target SDK is under its yearly
      # floor (API 36 from 31 August 2026).
      - name: Check the target SDK
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          TARGET="$("$AAPT2" dump badging build/app/outputs/flutter-apk/app-release.apk | sed -n "s/^targetSdkVersion:'\([0-9]*\)'.*/\1/p")"
          echo "targetSdkVersion: $TARGET"
          if [ -z "$TARGET" ] || [ "$TARGET" -lt 36 ]; then
            echo "::error::targetSdkVersion is ${TARGET:-unknown}; Google Play needs 36 or higher."
            exit 1
          fi

  rules:
    name: Firestore Security Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: test/rules/package.json

      # The Firestore emulator runs on the JVM.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install rules test dependencies
        working-directory: test/rules
        run: npm install

      # The rules are the boundary that has to hold even against a modified
      # client, so they are tested against the real emulator.
      - name: Test rules against the Firestore emulator
        run: >
          npx --yes firebase-tools@13 emulators:exec
          --only firestore
          --project quoridor-rules-test
          "cd test/rules && npm test"

  # On main, once both suites have passed, the tested rules go live. Rules
  # deployed by hand drifted from the app: a merge that tightened them was
  # only enforced whenever somebody remembered to deploy.
  deploy-rules:
    name: Deploy Firestore rules
    needs: [check, rules]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Two merges in quick succession deploy one after the other, never side
    # by side.
    concurrency:
      group: deploy-firestore-rules
      cancel-in-progress: false
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      # Without the key there is nothing to deploy with. A forked or fresh
      # copy of the repo should not go red over it, so say so and stop.
      - name: Say why nothing was deployed
        if: env.HAS_KEY != 'true'
        run: |
          echo "::warning::FIREBASE_SERVICE_ACCOUNT_JSON is not set, so the Firestore rules were not deployed. Add it with tool/setup_secrets.sh, or deploy by hand: firebase deploy --only firestore:rules --project quoridor-290f6"

      - uses: actions/checkout@v5
        if: env.HAS_KEY == 'true'

      - uses: google-github-actions/auth@v3
        if: env.HAS_KEY == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - uses: actions/setup-node@v5
        if: env.HAS_KEY == 'true'
        with:
          node-version: 24

      # The same firebase-tools the rules were just tested with. Unchanged
      # rules are left as they are, so a merge that does not touch them
      # deploys nothing.
      - name: Deploy the rules
        if: env.HAS_KEY == 'true'
        run: >
          npx --yes firebase-tools@13 deploy
          --only firestore:rules
          --project quoridor-290f6
          --non-interactive
