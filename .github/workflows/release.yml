name: Release

# Started by pushing a tag vX.Y.Z (bump.yml does that), or by hand for a tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Never cancel a release halfway; queue the next one instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The one Flutter version, kept equal to .fvmrc. A test holds every
  # workflow to it.
  FLUTTER_VERSION: 3.32.0
  ANDROID_PACKAGE: com.MoRe_H.quoridor

jobs:
  version:
    name: Version and secrets
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      build_number: ${{ github.run_number }}
      android_signing: ${{ steps.secrets.outputs.android_signing }}
      play: ${{ steps.secrets.outputs.play }}
      macos_signing: ${{ steps.secrets.outputs.macos_signing }}
      testflight: ${{ steps.secrets.outputs.testflight }}
    steps:
      - uses: actions/checkout@v5

      - name: Read the version and check the tag matches it
        id: read
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Run this for a tag (vX.Y.Z), not a branch."
            exit 1
          fi
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec.yaml version $VERSION."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Which optional jobs can run. A missing secret skips its job with a
      # note here rather than failing the release.
      - name: Check which secrets exist
        id: secrets
        env:
          ANDROID: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_STORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
          PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
          ASC: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8_BASE64 != '' }}
          MACOS: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 != '' && secrets.MACOS_DEVELOPER_ID_P12_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
          IOS: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 != '' && secrets.IOS_CERTIFICATE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          echo "android_signing=$ANDROID" >> "$GITHUB_OUTPUT"
          echo "play=$([ "$ANDROID" = true ] && [ "$PLAY" = true ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "macos_signing=$([ "$MACOS" = true ] && [ "$ASC" = true ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "testflight=$([ "$IOS" = true ] && [ "$ASC" = true ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ "$ANDROID" = true ] || echo "::warning::No Android signing secrets: the APK is signed with the debug key and no app bundle is built."
          [ "$PLAY" = true ] && [ "$ANDROID" = true ] || echo "::notice::Google Play upload skipped (needs PLAY_SERVICE_ACCOUNT_JSON and the Android signing secrets)."
          [ "$MACOS" = true ] && [ "$ASC" = true ] || echo "::notice::macOS build is not signed or notarized (needs MACOS_DEVELOPER_ID_* and ASC_* secrets)."
          [ "$IOS" = true ] && [ "$ASC" = true ] || echo "::notice::TestFlight skipped (needs IOS_CERTIFICATE_*, APPLE_TEAM_ID and ASC_* secrets)."

  checks:
    name: Analyze and test
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android
    needs: [version, checks]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Write the signing key
        if: needs.version.outputs.android_signing == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name=$VERSION --build-number=$BUILD \
            --dart-define=APP_VERSION=$VERSION \
            --dart-define=BUILD_NUMBER=$BUILD \
            --dart-define=APP_COMMIT=${{ github.sha }}
          cp build/app/outputs/flutter-apk/app-release.apk "quoridor-$VERSION-android.apk"

      - name: Build app bundle
        if: needs.version.outputs.android_signing == 'true'
        run: |
          flutter build appbundle --release \
            --build-name=$VERSION --build-number=$BUILD \
            --dart-define=APP_VERSION=$VERSION \
            --dart-define=BUILD_NUMBER=$BUILD \
            --dart-define=APP_COMMIT=${{ github.sha }}
          cp build/app/outputs/bundle/release/app-release.aab "quoridor-$VERSION-android.aab"

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/key.properties

      - uses: actions/upload-artifact@v6
        with:
          name: android
          path: quoridor-*-android.*

  linux:
    name: Linux
    needs: [version, checks]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        run: |
          flutter build linux --release \
            --build-name=$VERSION --build-number=$BUILD \
            --dart-define=APP_VERSION=$VERSION \
            --dart-define=BUILD_NUMBER=$BUILD \
            --dart-define=APP_COMMIT=${{ github.sha }}
          cd build/linux/x64/release/bundle
          zip -r "$GITHUB_WORKSPACE/quoridor-$VERSION-linux-x64.zip" .
      - uses: actions/upload-artifact@v6
        with:
          name: linux
          path: quoridor-*-linux-x64.zip

  windows:
    name: Windows
    needs: [version, checks]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        shell: bash
        run: |
          flutter build windows --release \
            --build-name=$VERSION --build-number=$BUILD \
            --dart-define=APP_VERSION=$VERSION \
            --dart-define=BUILD_NUMBER=$BUILD \
            --dart-define=APP_COMMIT=${{ github.sha }}
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "quoridor-$env:VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: quoridor-*-windows-x64.zip

  macos:
    name: macOS
    needs: [version, checks]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build_number }}
      APP: build/macos/Build/Products/Release/quoridor.app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        run: |
          flutter build macos --release \
            --build-name=$VERSION --build-number=$BUILD \
            --dart-define=APP_VERSION=$VERSION \
            --dart-define=BUILD_NUMBER=$BUILD \
            --dart-define=APP_COMMIT=${{ github.sha }}

      - name: Sign and notarize
        if: needs.version.outputs.macos_signing == 'true'
        env:
          P12: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/developer_id.p12"
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc_key.p8"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer_id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          codesign --force --deep --options runtime --timestamp \
            --entitlements macos/Runner/Release.entitlements \
            --sign "Developer ID Application" --keychain "$KEYCHAIN" "$APP"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/asc_key.p8" --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" --wait
          xcrun stapler staple "$APP"

      - name: Remove the signing keys
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/developer_id.p12" "$RUNNER_TEMP/asc_key.p8" "$RUNNER_TEMP/notarize.zip"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - name: Zip
        run: ditto -c -k --keepParent "$APP" "quoridor-$VERSION-macos.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: macos
          path: quoridor-*-macos.zip

  github-release:
    name: GitHub Release
    needs: [version, android, linux, windows, macos]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Whole history, so the notes can fall back to the commits since
          # the previous tag.
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      # The same script the web deploy uses. Installed builds read this file
      # through releases/latest, which only points at a finished release.
      - name: Write latest.json
        run: python3 tool/write_latest_json.py dist/latest.json

      - name: Release notes
        run: python3 -c "import json; print(json.load(open('dist/latest.json'))['notes'].get('en', ''))" > "$RUNNER_TEMP/notes.md"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: Quoridor ${{ env.VERSION }}
          body_path: ${{ runner.temp }}/notes.md
          files: dist/*

  google-play:
    name: Google Play (internal)
    needs: [version, android]
    if: needs.version.outputs.play == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: android
          path: dist
      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.ANDROID_PACKAGE }}
          releaseFiles: dist/*.aab
          track: internal
          status: completed

  testflight:
    name: TestFlight
    needs: [version, checks]
    if: needs.version.outputs.testflight == 'true'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      # Generates the Xcode settings (version, build number, defines) that
      # fastlane's build then signs and archives.
      - name: Prepare the iOS build
        run: |
          flutter build ios --release --no-codesign \
            --build-name=$VERSION --build-number=$BUILD \
            --dart-define=APP_VERSION=$VERSION \
            --dart-define=BUILD_NUMBER=$BUILD \
            --dart-define=APP_COMMIT=${{ github.sha }}

      - name: Write the signing keys
        env:
          P12: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/ios_distribution.p12"
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc_key.p8"

      - name: Build and upload with fastlane
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc_key.p8
          IOS_CERTIFICATE_PATH: ${{ runner.temp }}/ios_distribution.p12
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: fastlane beta

      - name: Remove the signing keys
        if: always()
        run: rm -f "$RUNNER_TEMP/ios_distribution.p12" "$RUNNER_TEMP/asc_key.p8"
